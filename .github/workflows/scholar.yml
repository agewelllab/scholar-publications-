name: Update Google Scholar Publications

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Scholar publications
        uses: sxlllslgh/google-scholar-fetcher@master
        with:
          google-scholar-id: OqIPbg4AAAAJ
          record-file: publications.json

      - name: Commit updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add publications.json

          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "Update Google Scholar publications"
            git push
          fi
