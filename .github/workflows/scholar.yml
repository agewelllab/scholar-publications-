name: Update Google Scholar Publications

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Scholar publications
        uses: sxlllslgh/google-scholar-fetcher@v1
        with:
          google-scholar-id: OqIPbg4AAAAJ
          record-file: publications.json

      - name: Add publications file
        run: |
          git add publications.json

      - name: Check whether publications changed
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automatically update Google Scholar publications"
          git push
